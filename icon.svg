<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Viomi Vacuum Integration Icon</title>
  <desc id="desc">Original icon in a product-photo style for a black robot vacuum.</desc>

  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="90%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e4ebf3"/>
    </radialGradient>

    <radialGradient id="shellOuter" cx="32%" cy="24%" r="78%">
      <stop offset="0%" stop-color="#4a5563"/>
      <stop offset="52%" stop-color="#202833"/>
      <stop offset="100%" stop-color="#0c1118"/>
    </radialGradient>

    <radialGradient id="shellInner" cx="40%" cy="36%" r="70%">
      <stop offset="0%" stop-color="#3b4655"/>
      <stop offset="100%" stop-color="#111821"/>
    </radialGradient>

    <linearGradient id="lidar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a8b5c4"/>
      <stop offset="100%" stop-color="#596674"/>
    </linearGradient>

    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#121a23" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="96" fill="url(#bg)"/>

  <ellipse cx="256" cy="364" rx="170" ry="46" fill="#1b2430" opacity="0.18"/>

  <g filter="url(#shadow)">
    <circle cx="256" cy="252" r="180" fill="url(#shellOuter)"/>
    <circle cx="256" cy="252" r="155" fill="url(#shellInner)"/>
    <circle cx="256" cy="252" r="176" fill="none" stroke="#6d7886" stroke-width="2.5" opacity="0.65"/>

    <path d="M128 304a134 134 0 0 0 256 0" fill="none" stroke="#0a0f15" stroke-width="26" stroke-linecap="round"/>
    <path d="M142 300a120 120 0 0 0 228 0" fill="none" stroke="#556473" stroke-width="4" opacity="0.55" stroke-linecap="round"/>

  </g>

  <g>
    <circle cx="256" cy="158" r="35" fill="url(#lidar)"/>
    <circle cx="256" cy="158" r="25" fill="#5b6877"/>
    <circle cx="256" cy="158" r="16" fill="#1f2935"/>
    <circle cx="247" cy="149" r="4" fill="#e7f2ff" opacity="0.95"/>
  </g>

  <g opacity="0.8">
    <rect x="234" y="268" width="44" height="16" rx="8" fill="#8795a4"/>
    <circle cx="248" cy="276" r="3" fill="#dde5ef"/>
    <circle cx="264" cy="276" r="3" fill="#dde5ef"/>
  </g>
</svg>
